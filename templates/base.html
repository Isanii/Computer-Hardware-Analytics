<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>

        {% block title %}
        Computer Hardware Analytics
        {% endblock %}

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<nav
class="
navbar
navbar-expand-lg
navbar-dark
bg-dark
shadow-sm
"
>

<div class="container">

    <a
    class="navbar-brand fw-bold"
    href="/"
    >

        <i class="fa-solid fa-microchip"></i>

        Computer Hardware Analytics

    </a>

    <button

        class="navbar-toggler"

        type="button"

        data-bs-toggle="collapse"

        data-bs-target="#navbarContent"

    >

        <span
        class="navbar-toggler-icon"
        ></span>

    </button>

    <div
    class="collapse navbar-collapse"
    id="navbarContent"
    >

        <!-- Menu -->

        <ul class="navbar-nav me-auto">

        <li class="nav-item">

            <a
            class="nav-link"
            href="/"
            >

                Trang chủ

            </a>

        </li>

        <li class="nav-item">

            <a
            class="nav-link"
            href="/products/view"
            >

                Sản phẩm

            </a>

        </li>

        <li class="nav-item dropdown">

            <a

            class="
            nav-link
            dropdown-toggle
            "

            href="#"

            role="button"

            data-bs-toggle="dropdown"

            >

                Benchmark

            </a>

            <ul class="dropdown-menu">

                <li>

                    <a
                    class="dropdown-item"
                    href="/benchmarks/cpu"
                    >

                        CPU Benchmark

                    </a>

                </li>

                <li>

                    <a
                    class="dropdown-item"
                    href="/benchmarks/gpu"
                    >

                        GPU Benchmark

                    </a>

                </li>

                <li><hr class="dropdown-divider"></li>

                <li>

                    <a
                    class="dropdown-item"
                    href="/compare/cpu"
                    >

                        Compare CPU

                    </a>

                </li>

                <li>

                    <a
                    class="dropdown-item"
                    href="/compare/gpu"
                    >

                        Compare GPU

                    </a>

                </li>

            </ul>

        </li>

        <li class="nav-item">

            <a
            class="nav-link"
            href="/dashboard"
            >

                Dashboard

            </a>

        </li>

    </ul>

        <!-- Search -->

        <form

            class="d-flex"

            action="/search"

            method="get"

        >

            <input

                class="form-control me-2"

                type="search"

                name="q"

                placeholder="RTX 5070, Ryzen 7, SSD Samsung..."

            >

            <button

                class="btn btn-outline-light"

                type="submit"

            >

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </form>

    </div>

</div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<footer
class="
bg-dark
text-light
text-center
mt-5
py-3
"
>

    <div class="container">

        Computer Hardware Analytics © 2026

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
